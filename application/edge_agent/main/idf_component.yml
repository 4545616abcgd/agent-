## IDF Component Manager Manifest File
dependencies:
  espressif/esp_board_manager:
    version: "^0.6"
    public: true

  app_claw:
    path: ../../../components/common/app_claw

  app_config:
    path: ../components/app_config

  cap_weather_station:
    path: ../../../components/claw_capabilities/cap_weather_station

  captive_dns:
    path: ../../../components/common/captive_dns

  cmd_voice:
    path: ../components/cmd_voice

  cmd_ota:
    path: ../components/cmd_ota

  cmd_weather:
    path: ../components/cmd_weather

  espressif/ramfs:
    version: "^0.1"

  claw_utils:
    path: ../../../components/claw_modules/claw_utils

  emote:
    path: ../../../components/common/emote
    rules:
      - if: $CONFIG{ESP_BOARD_DEV_DISPLAY_LCD_SUPPORT} == True

  http_reuse:
    path: ../../../components/common/http_reuse

  ota_service:
    path: ../../../components/common/ota_service

  voice_audio:
    path: ../../../components/common/voice_audio

  voice_service:
    path: ../../../components/common/voice_service
  voice_duplex_volc:
    path: ../../../components/common/voice_duplex_volc

  voice_agent:
    path: ../../../components/common/voice_agent

  voice_dialog:
    path: ../components/voice_dialog

  weather_service:
    path: ../../../components/common/weather_service

  weather_provider_qweather:
    path: ../../../components/common/weather_provider_qweather

  http_server:
    path: ../components/http_server

  settings:
    path: ../../../components/common/settings

  wifi_manager:
    path: ../../../components/common/wifi_manager

  esp_video:
    path: ../../../components/common/esp_video
    matches:
    - if: $CONFIG{ESP_BOARD_DEV_CAMERA_SUPPORT} == True
